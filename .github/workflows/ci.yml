name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Test (${{ matrix.testMode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode:
          - editmode
          - playmode
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.testMode }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ matrix.testMode }}-
            Library-

      - name: Check Unity License Secrets
        id: check_license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ]; then
            echo "has_license=true" >> $GITHUB_OUTPUT
          else
            echo "has_license=false" >> $GITHUB_OUTPUT
            echo "::warning::UNITY_LICENSE or UNITY_SERIAL secret is not set in repository secrets. Game-CI test execution requires a valid Unity license."
            echo "### ⚠️ Unity License Missing" >> $GITHUB_STEP_SUMMARY
            echo "To enable automated tests, please configure \`UNITY_LICENSE\` (or \`UNITY_SERIAL\`, \`UNITY_EMAIL\`, \`UNITY_PASSWORD\`) in your GitHub Repository Secrets." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Run Unity Tests
        if: steps.check_license.outputs.has_license == 'true'
        uses: game-ci/unity-test-runner@v4
        id: testRunner
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 2021.3.25f1
          testMode: ${{ matrix.testMode }}
          artifactsPath: ${{ matrix.testMode }}-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.testMode }} Test Results

      - name: Upload Test Results Artifacts
        uses: actions/upload-artifact@v4
        if: always() && steps.check_license.outputs.has_license == 'true'
        with:
          name: Test-Results-${{ matrix.testMode }}
          path: ${{ matrix.testMode }}-artifacts

      - name: Publish Test Summary
        if: always() && steps.check_license.outputs.has_license == 'true'
        run: |
          echo "### Test Results (${{ matrix.testMode }})" >> $GITHUB_STEP_SUMMARY
          if [ -d "${{ matrix.testMode }}-artifacts" ]; then
            echo "Artifacts saved under \`${{ matrix.testMode }}-artifacts\`." >> $GITHUB_STEP_SUMMARY
            find ${{ matrix.testMode }}-artifacts -type f -name "*.xml" -exec echo "Found XML report: {}" \; >> $GITHUB_STEP_SUMMARY
          else
            echo "No test artifacts directory found." >> $GITHUB_STEP_SUMMARY
          fi

  build:
    name: Build (StandaloneWindows64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-StandaloneWindows64-
            Library-

      - name: Check Unity License Secrets
        id: check_license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ]; then
            echo "has_license=true" >> $GITHUB_OUTPUT
          else
            echo "has_license=false" >> $GITHUB_OUTPUT
            echo "::warning::UNITY_LICENSE or UNITY_SERIAL secret is not set in repository secrets. Game-CI build execution requires a valid Unity license."
            echo "### ⚠️ Unity License Missing" >> $GITHUB_STEP_SUMMARY
            echo "To enable automated builds, please configure \`UNITY_LICENSE\` (or \`UNITY_SERIAL\`, \`UNITY_EMAIL\`, \`UNITY_PASSWORD\`) in your GitHub Repository Secrets." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build Standalone Windows 64
        if: steps.check_license.outputs.has_license == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 2021.3.25f1
          targetPlatform: StandaloneWindows64
          buildName: CrystalFrost

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always() && steps.check_license.outputs.has_license == 'true'
        with:
          name: StandaloneWindows64-Build
          path: build/StandaloneWindows64
